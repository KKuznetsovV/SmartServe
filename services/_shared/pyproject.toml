[project]
name = "smartserve-shared"
version = "0.1.0"
description = "Shared FastAPI helpers for SmartServe backend services"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.8",
    "httpx>=0.27",
    "bcrypt>=4.0.0",
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "structlog>=25.4.0",
    "slowapi>=0.1.9",
    "aio-pika>=9.4.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.26.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartserve_shared = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
