[project]
name = "smartserve-shared"
version = "0.1.0"
description = "Internal-only shared library: JWT verification, service HTTP client"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["security", "http_client"]
