worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 20m;

    map $http_origin $cors_origin {
        "http://localhost:3000" "http://localhost:3000";
        "http://localhost:3001" "http://localhost:3001";
        "http://localhost:8081" "http://localhost:8081";
        default                 "";
    }

    # Step 16: gateway introduced, everything routed to apps/api monolith.
    # Step 17: auth/businesses/locations extracted to services/auth.
    # Step 18: menu/discounts extracted to services/catalog.
    # Step 19: orders/tables extracted to services/ordering.
    # Step 20: payments extracted to services/payments.
    # Step 21: shifts extracted to services/staff; staff user CRUD is owned by auth.
    # Step 24: ai extracted to services/ai (stateless orchestrator, no owned DB — calls
    # back into auth/catalog/printing over HTTP to execute confirmed actions).
    # Step 25: apps/api monolith retired entirely — its only remaining endpoints (health,
    # real-time order/KDS websocket) were health (no longer needed, every service has its
    # own) and ws (migrated to services/ordering, the natural owner of order/KDS events).
    # See docs/microservices-plan.md §5.
    server {
        listen 80;
        listen [::]:80;

        # Strip upstream CORS headers to prevent duplicates, then re-add at gateway level.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept' always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Max-Age           86400 always;

        # Handle CORS preflight before any location matching.
        # Note: add_header is not valid inside an `if` at server level (only inside
        # `location`/`if in location`), so headers are set unconditionally above instead.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Exception: /orders/{id}/payments is owned by `payments`, not `ordering` — this
        # regex location is checked before the plain /api/v1/orders prefix location below
        # (nginx always evaluates regex locations unless a `^~` prefix match wins), so it
        # must come first and win for this one path shape.
        location ~ ^/api/v1/orders/[^/]+/payments {
            set $upstream http://payments:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exception: /businesses/{id}/discounts is owned by `catalog`, not `auth` — this
        # regex location is checked before the plain /api/v1/businesses/ prefix location
        # below (nginx always evaluates regex locations unless a `^~` prefix match wins),
        # so it must come first and win for this one path shape.
        location ~ ^/api/v1/businesses/[^/]+/discounts {
            set $upstream http://catalog:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exception: /locations/{id}/tables and /locations/{id}/orders are owned by
        # `ordering`, not `auth` — same precedence reasoning as the discounts exception
        # above; bare /locations/{id} (no further segments) still falls through to auth.
        location ~ ^/api/v1/locations/[^/]+/(tables|orders) {
            set $upstream http://ordering:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exception: /locations/{id}/shifts is owned by `staff`, not `auth` — same
        # precedence reasoning as the tables/orders exception above; bare /locations/{id}
        # (no further segments) still falls through to auth.
        location ~ ^/api/v1/locations/[^/]+/shifts {
            set $upstream http://staff:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exception: /locations/{id}/printers and /locations/{id}/printer-routes are
        # owned by `printing`, not `auth` — same precedence reasoning as the shifts
        # exception above; bare /locations/{id} (no further segments) still falls
        # through to auth.
        location ~ ^/api/v1/locations/[^/]+/printer(s|-routes) {
            set $upstream http://printing:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Audit log lives on reporting as GET /api/v1/events. Tenants reach it as
        # /api/v1/audit/events so it is not confused with location reports.
        location /api/v1/audit/ {
            set $upstream http://reporting:8000;
            rewrite ^/api/v1/audit/(.*)$ /api/v1/$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exception: /locations/{id}/reports/* is owned by `reporting`, not `auth` — same
        # precedence reasoning as the printers exception above; bare /locations/{id} (no
        # further segments) still falls through to auth. There is no plain top-level
        # /api/v1/reports prefix location since the only reporting endpoint is nested
        # under /locations/{id}/reports/summary.
        location ~ ^/api/v1/locations/[^/]+/reports {
            set $upstream http://reporting:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/ {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/businesses/ {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/locations/ {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/menu/ {
            set $upstream http://catalog:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/discounts {
            set $upstream http://catalog:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/orders {
            set $upstream http://ordering:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/tables {
            set $upstream http://ordering:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/payments {
            set $upstream http://payments:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/staff {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/shifts {
            set $upstream http://staff:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/printers {
            set $upstream http://printing:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/printer-routes {
            set $upstream http://printing:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ai/ {
            set $upstream http://ai:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time order/KDS events — migrated from apps/api to services/ordering (Step 25)
        location /api/v1/ws/ {
            set $upstream http://ordering:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Customer-facing display screens poll the no-auth public active-orders endpoint
        location /api/v1/public/ {
            set $upstream http://ordering:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/health {
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }
    }
}


