worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 20m;

    # Step 16: every path still routes to the existing apps/api monolith. As each
    # domain service is extracted (steps 17-24), its path prefixes move to their
    # own upstream block below — no frontend changes required (see docs/microservices-plan.md §5).
    server {
        listen 80;
        listen [::]:80;

        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            set $upstream http://api:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
