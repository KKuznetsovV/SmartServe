worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 20m;

    # Step 16: gateway introduced, everything routed to apps/api monolith.
    # Step 17: auth/businesses/locations extracted to services/auth. As each remaining
    # domain service is extracted (steps 18-24), its path prefixes move to their own
    # upstream block below — no frontend changes required (see docs/microservices-plan.md §5).
    server {
        listen 80;
        listen [::]:80;

        # Exception: /businesses/{id}/discounts is owned by `catalog` (still in apps/api),
        # not `auth` — this regex location is checked before the plain /api/v1/businesses/
        # prefix location below (nginx always evaluates regex locations unless a `^~`
        # prefix match wins), so it must come first and win for this one path shape.
        location ~ ^/api/v1/businesses/[^/]+/discounts {
            set $upstream http://api:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/ {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/businesses/ {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/locations/ {
            set $upstream http://auth:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            set $upstream http://api:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}

