[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S105", "S106", "B008", "E501"]  # S10x: env-var passwords; B008: FastAPI Depends pattern; E501: handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "app.api.v1.endpoints.ai"
disallow_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
