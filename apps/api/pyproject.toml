[tool.ruff]
target-version = "py314"
line-length = 100
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S105", "S106"]  # hardcoded password warnings — we use env vars

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
