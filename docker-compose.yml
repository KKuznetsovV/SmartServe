services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartserve}
      POSTGRES_DB: ${POSTGRES_DB:-smartserve}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-smartserve}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-smartserve}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartserve}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartserve}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      ENVIRONMENT: development
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  catalog:
    build:
      context: ./services
      dockerfile: catalog/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/catalog:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  ordering:
    build:
      context: ./services
      dockerfile: ordering/Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth:8000
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - ./services/ordering:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  payments:
    build:
      context: ./services
      dockerfile: payments/Dockerfile
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ordering:
        condition: service_healthy
    volumes:
      - ./services/payments:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  staff:
    build:
      context: ./services
      dockerfile: staff/Dockerfile
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - ./services/staff:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  printing:
    build:
      context: ./services
      dockerfile: printing/Dockerfile
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/printing:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  reporting:
    build:
      context: ./services
      dockerfile: reporting/Dockerfile
    ports:
      - "8007:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/reporting:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  ai:
    build:
      context: ./services
      dockerfile: ai/Dockerfile
    ports:
      - "8008:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartserve}:${POSTGRES_PASSWORD:-smartserve}@db:5432/${POSTGRES_DB:-smartserve}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-256-bit-random-string}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_SERVICE_URL: http://auth:8000
      CATALOG_SERVICE_URL: http://catalog:8000
      PRINTING_SERVICE_URL: http://printing:8000
      REPORTING_SERVICE_URL: http://reporting:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartserve}:${RABBITMQ_PASSWORD:-smartserve}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartserve}@redis:6379/2
      ENVIRONMENT: development
      # Empty by default so a fresh clone needs nothing outside this repo.
      LOCAL_MODEL_PATH: ${LOCAL_MODEL_PATH:-}
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      printing:
        condition: service_healthy
      reporting:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ai:/app
      - ./services/_shared:/shared
      - ${LOCAL_MODEL_DIR:-./models}:/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.254 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    networks:
      default:
        ipv4_address: 172.28.0.254
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      ordering:
        condition: service_healthy
      payments:
        condition: service_healthy
      staff:
        condition: service_healthy
      printing:
        condition: service_healthy
      reporting:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_ORDERS_URL: http://localhost:3001
    depends_on:
      - gateway

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
