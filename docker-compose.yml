services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartserve
      POSTGRES_PASSWORD: smartserve
      POSTGRES_DB: smartserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/catalog:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ordering:
    build:
      context: ./services/ordering
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ordering:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  payments:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/payments:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  staff:
    build:
      context: ./services/staff
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/staff:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
      - auth
      - catalog
      - ordering
      - payments
      - staff
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

volumes:
  postgres_data:
