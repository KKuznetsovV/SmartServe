services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartserve
      POSTGRES_PASSWORD: smartserve
      POSTGRES_DB: smartserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: smartserve
      RABBITMQ_DEFAULT_PASS: smartserve
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  catalog:
    build:
      context: ./services
      dockerfile: catalog/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/catalog:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ordering:
    build:
      context: ./services
      dockerfile: ordering/Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/ordering:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  payments:
    build:
      context: ./services
      dockerfile: payments/Dockerfile
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/payments:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  staff:
    build:
      context: ./services
      dockerfile: staff/Dockerfile
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/staff:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  printing:
    build:
      context: ./services
      dockerfile: printing/Dockerfile
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/printing:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  reporting:
    build:
      context: ./services
      dockerfile: reporting/Dockerfile
    ports:
      - "8007:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smartserve:smartserve@db:5432/smartserve
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      ENVIRONMENT: development
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/reporting:/app
      - ./services/_shared:/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build:
      context: ./services
      dockerfile: ai/Dockerfile
    ports:
      - "8008:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-256-bit-random-string}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_SERVICE_URL: http://auth:8000
      CATALOG_SERVICE_URL: http://catalog:8000
      PRINTING_SERVICE_URL: http://printing:8000
      REPORTING_SERVICE_URL: http://reporting:8000
      RABBITMQ_URL: amqp://smartserve:smartserve@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/2
      ENVIRONMENT: development
      # Mount the quantized GGUF from the sibling smartserve-agent-model repo.
      # Set to empty string to disable the local tier and use Haiku/Sonnet only.
      LOCAL_MODEL_PATH: /models/Qwen2.5-1.5B-Instruct.Q4_K_M.gguf
    env_file:
      - ./.env
    depends_on:
      - auth
      - catalog
      - printing
      - reporting
      - rabbitmq
      - redis
    volumes:
      - ./services/ai:/app
      - ./services/_shared:/shared
      - ../smartserve-agent-model/inference_gguf:/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - auth
      - catalog
      - ordering
      - payments
      - staff
      - printing
      - reporting
      - ai
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway

volumes:
  postgres_data:
