name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ─── TypeScript packages & web app ────────────────────────────────────────
  ts-check:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm turbo run build --filter=@smartserve/types --filter=@smartserve/api-client

      - name: Typecheck all
        run: pnpm turbo run typecheck

      - name: Lint web
        run: pnpm turbo run lint --filter=@smartserve/web

  # ─── Python services ──────────────────────────────────────────────────────
  # apps/api was retired (step 25) — every backend domain now lives under
  # services/<name> as its own independently deployable FastAPI app. Each
  # service's test suite runs against an in-memory SQLite DB, so no Postgres/
  # Redis containers are needed in CI.
  python-check:
    name: Python lint & typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, ordering, payments, staff, printing, reporting, ai]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install shared lib
        if: matrix.service == 'ai'
        run: pip install -e ../_shared

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: Mypy typecheck
        run: mypy app/ --ignore-missing-imports --explicit-package-bases

  # ─── Python tests ─────────────────────────────────────────────────────────
  python-test:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, ordering, payments, staff, printing, reporting, ai]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install shared lib
        if: matrix.service == 'ai'
        run: pip install -e ../_shared

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short

  # ─── Frontend tests ───────────────────────────────────────────────────────
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm turbo run build --filter=@smartserve/types --filter=@smartserve/api-client

      - name: Run frontend tests
        run: pnpm turbo run test --filter=@smartserve/web

  # ─── E2E tests (smoke only, no server required for static assertions) ─────
  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    # Only run if a BASE_URL is available (skip in forks or when no server is deployed)
    if: ${{ vars.E2E_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm --filter=@smartserve/web exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: pnpm --filter=@smartserve/web e2e
